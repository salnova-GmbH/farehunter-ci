name: FareHunter Social Content

# Renders the weekly Thursday "Kabinen-Check" for Instagram (photo carousel in even
# ISO weeks, faceless Reel in odd weeks) from the photo library committed in the
# private repo (social/instagram/library/, synced from OneDrive by hand), tied to the
# cheapest current deal on the same airline. Output goes to public/ig/<id>/ (deployed,
# because the Instagram API only takes public URLs) plus a queue item; instagram.yml
# posts it Thursday 17:17 UTC. Separate from blog.yml so a week without a new blog
# post still gets its cabin post.

on:
  schedule:
    - cron: "37 6 * * 3"   # Wednesdays 06:37 UTC — off the round hour (see scan.yml)
  workflow_dispatch: {}

concurrency:
  group: farehunter-social
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Same build inputs as blog.yml (src/, public/, public-web/ — omitting public/
      # makes the build delete every static asset from dist/, see CLAUDE.md) plus
      # deals/ (deal matching) and social/ (library, scripts, queue).
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v7
        with:
          repository: salnova-GmbH/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            src/
            deals/
            public/
            public-web/
            social/
          sparse-checkout-cone-mode: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install ffmpeg
        run: command -v ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)

      - name: Render cabin post
        id: render
        shell: bash   # -o pipefail: a failing generator must fail the step despite tee
        run: |
          node social/instagram/scripts/cabin-post.mjs --web | tee -a "$GITHUB_STEP_SUMMARY"
          if git status --porcelain social/instagram/queue public/ig | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build site
        if: steps.render.outputs.changed == 'true'
        run: npm run build

      - name: Commit
        if: steps.render.outputs.changed == 'true'
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A social/instagram/queue/ public/ig/ public-web/dist/
          git commit -m "social: weekly cabin post $(date -u +'%Y-%m-%d')"
          for i in {1..6}; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 15 + 5))
          done
