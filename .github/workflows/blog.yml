name: FareHunter Weekly Blog Post

# Publishes the "Deal of the Week" blog post every Tuesday. Separate from
# scan.yml/ultra.yml (same reasoning as their split: triggering one must not
# kick off the others) — scheduled well after scan.yml's daily 1 AM UTC run,
# which takes ~2-3h, so deals/*.json is fresh by the time this runs.
# Also renders the matching Instagram carousel (posted later by instagram.yml).

on:
  schedule:
    - cron: "0 6 * * 2"   # Tuesdays, 06:00 UTC
  workflow_dispatch: {}

concurrency:
  group: farehunter-blog
  cancel-in-progress: false

permissions:
  contents: read   # this public repo needs no write access

jobs:
  publish:
    name: Generate & publish weekly deal post
    runs-on: ubuntu-latest
    timeout-minutes: 40   # incl. up to 15 min waiting for the Cloudflare deploy before IndexNow
    steps:
      # Needs deals/*.json (deal selection), src/content/blog/ (dedup state
      # + the post itself), the rest of src/ + root config (full Astro
      # build), scripts/ (generation logic), public/ (Astro's static-assets
      # source — destination hero images, OG images, robots.txt, sitemap.xml;
      # astro.config.mjs copies this into outDir verbatim, so omitting it
      # doesn't just mean missing images, it means npm run build silently
      # produces a dist/ with those files DELETED, and committing that
      # wipes them off the live site), and public-web/ (build output + the
      # files Cloudflare doesn't build), and stats/ (per-route price
      # summaries written by every scan job, ~1.6 MB — the data behind the
      # /business-class/ destination pages). Not data/, skips/, scans/ — the
      # multi-GB history this job never touches.
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v7
        with:
          repository: salnova-GmbH/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            src/
            scripts/
            deals/
            public/
            public-web/
            social/
            stats/
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      # Only the playwright *package* is needed (scraper.py imports
      # playwright.sync_api at module level so generate_blog_post.py can
      # reuse its build_search_url() classmethod) — no browser is ever
      # launched here, so skip the Chromium download/cache steps scan.yml
      # needs.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Select this week's deal
        run: python scripts/generate_blog_post.py

      # Weekly refresh of the /business-class/ destination pages: typical
      # prices from stats/*.json + live deal counts → src/data/destination-stats.json.
      # A failure keeps last week's file (the pages just show older numbers).
      - name: Refresh destination stats
        continue-on-error: true
        run: python scripts/build_destination_stats.py

      - name: Check whether a new post was written
        id: check
        run: |
          if git status --porcelain src/content/blog | grep -q .; then
            echo "new_post=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_post=false" >> "$GITHUB_OUTPUT"
            echo "No eligible deal this week (all remaining destinations still in their 6-week cooldown, or no deals at all) — no new post." >> "$GITHUB_STEP_SUMMARY"
          fi
          if git status --porcelain src/content/blog src/data/destination-stats.json | grep -q .; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Destination stats unchanged too — nothing to build." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.check.outputs.build == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Node dependencies
        if: steps.check.outputs.build == 'true'
        run: npm ci

      # Instagram carousel for the same deal (German, 6 slides): slides land in
      # public/ig/<slug>-deal/ so this build deploys them (the Instagram API only
      # takes public image URLs), plus a queue item that instagram.yml posts at
      # 10:17 UTC. Never blocks the blog post itself.
      - name: Render Instagram carousel
        if: steps.check.outputs.new_post == 'true'
        continue-on-error: true
        run: node social/instagram/scripts/deal-carousel.mjs --web

      # public-web/dist/ is committed — Cloudflare serves it as-is and does
      # not build (see CLAUDE.md "Web app"), so the new post is invisible on
      # the live site until this runs and its output is committed below.
      - name: Build site
        if: steps.check.outputs.build == 'true'
        run: npm run build

      - name: Commit new post / destination stats + rebuilt dist
        if: steps.check.outputs.build == 'true'
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ src/data/destination-stats.json public-web/dist/
          # separate calls: a missing path (no carousel rendered) must not stop the other
          git add -A social/instagram/queue/ 2>/dev/null || true
          git add -A public/ig/ 2>/dev/null || true
          # Pages this build changed, for IndexNow below.
          git diff --cached --name-only --diff-filter=AMR -- 'public-web/dist/*.html' > "$RUNNER_TEMP/changed-pages.txt"
          if [ "${{ steps.check.outputs.new_post }}" = "true" ]; then
            git commit -m "content: weekly deal post $(date -u +'%Y-%m-%d')"
          else
            git commit -m "content: weekly destination stats $(date -u +'%Y-%m-%d')"
          fi
          for i in {1..6}; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 15 + 5))
          done

      # Tell Bing & co. (IndexNow) which indexable pages changed, once the
      # Cloudflare deploy this push started is live. Only sitemap URLs are sent.
      - name: Submit changed pages to IndexNow
        if: steps.check.outputs.build == 'true'
        continue-on-error: true
        run: node scripts/indexnow.mjs --from-file "$RUNNER_TEMP/changed-pages.txt" --wait
