name: Keepalive

# GitHub disables scheduled workflows in public repos after 60 days without
# repo activity (workflow runs don't count). Re-enabling every workflow via the
# API resets that timer, including for this workflow itself. No commits needed.

on:
  schedule:
    - cron: "23 4 * * 1"   # Mondays, 04:23 UTC
  workflow_dispatch: {}

permissions:
  actions: write   # required to call the "enable workflow" endpoint
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable all workflows
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for wf in scan.yml ultra.yml bundle.yml blog.yml keepalive.yml; do
            gh api -X PUT "repos/$REPO/actions/workflows/$wf/enable" \
              && echo "enabled $wf"
          done
