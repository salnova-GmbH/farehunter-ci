name: FareHunter Daily Scan

on:
  schedule:
    - cron: "0 1 * * *"   # 1 AM UTC every day
  workflow_dispatch:
    inputs:
      route:
        description: 'Route to scan, e.g. ZRH-JFK (empty = ALL)'
        required: false
        default: ''
        type: string

# Workflow-level guard: never let two full scans (or two runs of the same
# single-route dispatch) execute at once. Overlapping runs split the org's 40
# concurrent-runner slots between them (measured: peak concurrency dropped
# 40 → 20 and wall time doubled from ~7 h to ~15.7 h on 2026-08-04). A new
# full run queues behind the running one instead. Single-route dispatches get
# their own group so they don't wait hours behind a full scan; the per-route
# job-level groups below still serialize same-route jobs across runs.
concurrency:
  group: farehunter-scan-${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.route != '') && github.event.inputs.route || 'ALL' }}
  cancel-in-progress: false

permissions:
  contents: read   # this public repo needs no write access

jobs:
  scan:
    # 3 routes per job (75 jobs instead of 220): same scrape time, but 145
    # fewer checkout/install setups and far less contention in the parallel
    # commit/pull-rebase race. 150-min timeout = 3 × ~40 min + setup headroom.
    name: Scrape ${{ join(matrix.routes, ' ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: fare-hunter-scan-${{ join(matrix.routes, '-') }}
      cancel-in-progress: false

    strategy:
      fail-fast: false
      matrix:
        routes: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.route != '') && fromJSON(format('[["{0}"]]', github.event.inputs.route)) || fromJSON('[["ZRH-JFK","ZRH-LAX","ZRH-SFO"],["ZRH-NRT","ZRH-HND","ZRH-SIN"],["ZRH-HKG","ZRH-BKK","ZRH-SEA"],["ZRH-BOG","ZRH-ICN","ZRH-JNB"],["ZRH-DXB","ZRH-DEL","ZRH-KUL"],["ZRH-SGN","ZRH-TPE","ZRH-GRU"],["ZRH-YYZ","FRA-JFK","FRA-LAX"],["FRA-SFO","FRA-NRT","FRA-HND"],["FRA-SIN","FRA-HKG","FRA-BKK"],["FRA-SEA","FRA-BOG","FRA-ICN"],["FRA-JNB","FRA-DXB","FRA-DEL"],["FRA-KUL","FRA-SGN","FRA-TPE"],["FRA-GRU","FRA-YYZ","MXP-JFK"],["MXP-LAX","MXP-SFO","MXP-NRT"],["MXP-HND","MXP-SIN","MXP-HKG"],["MXP-BKK","MXP-SEA","MXP-BOG"],["MXP-ICN","MXP-JNB","MXP-DXB"],["MXP-DEL","MXP-KUL","MXP-SGN"],["MXP-TPE","MXP-GRU","MXP-YYZ"],["VIE-JFK","VIE-LAX","VIE-SFO"],["VIE-NRT","VIE-HND","VIE-SIN"],["VIE-HKG","VIE-BKK","VIE-SEA"],["VIE-BOG","VIE-ICN","VIE-JNB"],["VIE-DXB","VIE-DEL","VIE-KUL"],["VIE-SGN","VIE-TPE","VIE-GRU"],["VIE-YYZ","AMS-JFK","AMS-LAX"],["AMS-SFO","AMS-NRT","AMS-HND"],["AMS-SIN","AMS-HKG","AMS-BKK"],["AMS-SEA","AMS-BOG","AMS-ICN"],["AMS-JNB","AMS-DXB","AMS-DEL"],["AMS-KUL","AMS-SGN","AMS-TPE"],["AMS-GRU","AMS-YYZ","MUC-JFK"],["MUC-LAX","MUC-SFO","MUC-NRT"],["MUC-HND","MUC-SIN","MUC-HKG"],["MUC-BKK","MUC-SEA","MUC-BOG"],["MUC-ICN","MUC-JNB","MUC-DXB"],["MUC-DEL","MUC-KUL","MUC-SGN"],["MUC-TPE","MUC-GRU","MUC-YYZ"],["BUD-JFK","BUD-LAX","BUD-SFO"],["BUD-NRT","BUD-HND","BUD-SIN"],["BUD-HKG","BUD-BKK","BUD-SEA"],["BUD-BOG","BUD-ICN","BUD-JNB"],["BUD-DXB","BUD-DEL","BUD-KUL"],["BUD-SGN","BUD-TPE","BUD-GRU"],["BUD-YYZ","MAD-JFK","MAD-LAX"],["MAD-SFO","MAD-NRT","MAD-HND"],["MAD-SIN","MAD-HKG","MAD-BKK"],["MAD-SEA","MAD-BOG","MAD-ICN"],["MAD-JNB","MAD-DXB","MAD-DEL"],["MAD-KUL","MAD-SGN","MAD-TPE"],["MAD-GRU","MAD-YYZ","WAW-JFK"],["WAW-LAX","WAW-SFO","WAW-NRT"],["WAW-HND","WAW-SIN","WAW-HKG"],["WAW-BKK","WAW-SEA","WAW-BOG"],["WAW-ICN","WAW-JNB","WAW-DXB"],["WAW-DEL","WAW-KUL","WAW-SGN"],["WAW-TPE","WAW-GRU","WAW-YYZ"],["GVA-JFK","GVA-LAX","GVA-SFO"],["GVA-NRT","GVA-HND","GVA-SIN"],["GVA-HKG","GVA-BKK","GVA-SEA"],["GVA-BOG","GVA-ICN","GVA-JNB"],["GVA-DXB","GVA-DEL","GVA-KUL"],["GVA-SGN","GVA-TPE","GVA-GRU"],["GVA-YYZ"],["CPH-JFK","CPH-LAX","CPH-SFO"],["CPH-NRT","CPH-HND","CPH-SIN"],["CPH-HKG","CPH-BKK","CPH-SEA"],["CPH-BOG","CPH-ICN","CPH-JNB"],["CPH-DXB","CPH-DEL","CPH-KUL"],["CPH-SGN","CPH-TPE","CPH-GRU"],["CPH-YYZ"],["ZRH-MIA","FRA-MIA","MXP-MIA"],["VIE-MIA","AMS-MIA","MUC-MIA"],["BUD-MIA","MAD-MIA","WAW-MIA"],["GVA-MIA","CPH-MIA"],["ZRH-SYD","ZRH-RUH","ZRH-LIM"],["ZRH-SJO","FRA-SYD","FRA-RUH"],["FRA-LIM","FRA-SJO","MXP-SYD"],["MXP-RUH","MXP-LIM","MXP-SJO"],["VIE-SYD","VIE-RUH","VIE-LIM"],["VIE-SJO","AMS-SYD","AMS-RUH"],["AMS-LIM","AMS-SJO","MUC-SYD"],["MUC-RUH","MUC-LIM","MUC-SJO"],["BUD-SYD","BUD-RUH","BUD-LIM"],["BUD-SJO","MAD-SYD","MAD-RUH"],["MAD-LIM","MAD-SJO","WAW-SYD"],["WAW-RUH","WAW-LIM","WAW-SJO"],["GVA-SYD","GVA-RUH","GVA-LIM"],["GVA-SJO","CPH-SYD","CPH-RUH"],["CPH-LIM","CPH-SJO"],["ZRH-PEK","FRA-PEK","MXP-PEK"],["VIE-PEK","AMS-PEK","MUC-PEK"],["BUD-PEK","MAD-PEK","WAW-PEK"],["GVA-PEK","CPH-PEK"],["ZRH-TLV","FRA-TLV","MXP-TLV"],["VIE-TLV","AMS-TLV","MUC-TLV"],["BUD-TLV","MAD-TLV","WAW-TLV"],["GVA-TLV","CPH-TLV"],["ZRH-ORD","ZRH-IAD","ZRH-BOS"],["ZRH-BOM","ZRH-EZE","ZRH-MEX"],["FRA-ORD","FRA-IAD","FRA-BOS"],["FRA-BOM","FRA-EZE","FRA-MEX"],["MXP-ORD","MXP-IAD","MXP-BOS"],["MXP-BOM","MXP-EZE","MXP-MEX"],["VIE-ORD","VIE-IAD","VIE-BOS"],["VIE-BOM","VIE-EZE","VIE-MEX"],["AMS-ORD","AMS-IAD","AMS-BOS"],["AMS-BOM","AMS-EZE","AMS-MEX"],["MUC-ORD","MUC-IAD","MUC-BOS"],["MUC-BOM","MUC-EZE","MUC-MEX"],["BUD-ORD","BUD-IAD","BUD-BOS"],["BUD-BOM","BUD-EZE","BUD-MEX"],["MAD-ORD","MAD-IAD","MAD-BOS"],["MAD-BOM","MAD-EZE","MAD-MEX"],["WAW-ORD","WAW-IAD","WAW-BOS"],["WAW-BOM","WAW-EZE","WAW-MEX"],["GVA-ORD","GVA-IAD","GVA-BOS"],["GVA-BOM","GVA-EZE","GVA-MEX"],["CPH-ORD","CPH-IAD","CPH-BOS"],["CPH-BOM","CPH-EZE","CPH-MEX"]]') }}

    steps:
      # blob:none + sparse checkout: each scan job needs only the Python code
      # (root files) and its own routes' data/deals/skips/scans files. A full
      # checkout of the data-heavy private repo took ~310 s per job; this
      # takes seconds. `git pull --rebase`/`git push` in the commit step still
      # work — missing blobs are fetched on demand from the promisor remote.
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v7
        with:
          repository: salnova-GmbH/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
          sparse-checkout-cone-mode: false

      - name: Add this job's route files to the sparse checkout
        run: |
          for R in ${{ join(matrix.routes, ' ') }}; do
            git sparse-checkout add "data/$R.json" "deals/$R.json" "skips/$R.json" "scans/$R"
          done

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'from importlib.metadata import version; print(version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browser + system deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install chromium --with-deps

      - name: Install Playwright system deps (browser cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install-deps chromium

      - name: Run FareHunter — ${{ join(matrix.routes, ' ') }}
        run: |
          mkdir -p data deals skips   # sparse checkout omits them if a route is new
          FAILED=""
          for R in ${{ join(matrix.routes, ' ') }}; do
            echo "::group::Scan $R"
            python main.py --route "$R" || FAILED="$FAILED $R"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then
            echo "Failed routes:$FAILED"
            exit 1
          fi

      - name: Write job summary
        if: always()
        shell: python
        run: |
          import json, os, pathlib

          summary_file = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_file:
              raise SystemExit(0)

          lines = []
          for route in "${{ join(matrix.routes, ' ') }}".split():
              try:
                  deals = json.loads(pathlib.Path(f"deals/{route}.json").read_text(encoding="utf-8"))
              except Exception:
                  deals = []
              stats = {}
              try:
                  index = json.loads(pathlib.Path(f"scans/{route}/index.json").read_text(encoding="utf-8"))
                  stats = index[-1].get("stats", {})
              except Exception:
                  pass

              lines.append(f"## FareHunter — {route}\n")
              if stats:
                  lines.append(
                      f"searched {stats.get('searched', '?')} · failed {stats.get('failed', '?')}"
                      f" · skipped {stats.get('skipped', 0)} known-empty far-horizon combos\n"
                  )
              if deals:
                  lines.append(f"### {len(deals)} deal(s) detected\n")
                  for d in deals:
                      icon = "🔥" if d["deal"] == "EXCEPTIONAL DEAL" else "✅"
                      dep = d.get("departure_date", "")
                      ret = d.get("return_date", "")
                      date_range = f"{dep} → {ret}" if ret else dep
                      lines.append(
                          f"{icon} **{d['origin']} → {d['destination']}** ({date_range}) — "
                          f"${d['price']:,.0f} vs ${d['baseline']:,.0f} baseline "
                          f"({d['deal']}) — {d['airline']}"
                      )
              else:
                  lines.append("No deals detected this run.")
              lines.append("")

          with open(summary_file, "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

      - name: Upload deals artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: deals-${{ join(matrix.routes, '-') }}-${{ github.run_id }}
          path: deals/*.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: debug-screenshots-${{ join(matrix.routes, '-') }}-${{ github.run_id }}
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit results back to FareHunter
        if: always()
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for R in ${{ join(matrix.routes, ' ') }}; do
            [ -f "data/$R.json" ]  && git add "data/$R.json"  || true
            [ -f "deals/$R.json" ] && git add "deals/$R.json" || true
            [ -f "skips/$R.json" ] && git add "skips/$R.json" || true
          done
          [ -d scans ] && git add scans/ || true
          if git diff --staged --quiet; then
            echo "No new data — nothing to commit."
          else
            git commit -m "chore: scan ${{ join(matrix.routes, ' ') }} $(date -u +'%Y-%m-%d %H:%M UTC')"
            for i in {1..6}; do
              git pull --rebase && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep $((RANDOM % 15 + 5))
            done
          fi

  deploy:
    name: Bundle deals-data.js → triggers Cloudflare auto-deploy
    needs: scan
    if: always()
    runs-on: ubuntu-latest
    steps:
      # Needs deals/*.json, skips/*.json, scans/*/index.json and the two
      # generated public-web bundles — not the full data/dist tree.
      - name: Checkout private FareHunter repo
        uses: actions/checkout@v7
        with:
          repository: salnova-GmbH/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          ref: main
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            deals/
            skips/
            scans/*/index.json
            public-web/deals-data.js
            public-web/ops-data.js
          sparse-checkout-cone-mode: false

      - name: Generate deals-data.js from all route deals files
        working-directory: public-web
        shell: python
        run: |
          import json, pathlib, datetime
          from collections import defaultdict

          today = datetime.date.today().isoformat()
          DEALS_PER_GROUP = 20  # per (route, airline)

          deals_raw = []
          for f in sorted(pathlib.Path('../deals').glob('*.json')):
              try:
                  content = json.loads(f.read_text(encoding='utf-8'))
                  if isinstance(content, list):
                      deals_raw.extend(content)
              except Exception:
                  pass

          # 1. Filter past departures; deduplicate keeping most recent scan per combo
          seen = {}
          for d in deals_raw:
              if d.get('departure_date', '') < today:
                  continue
              key = (d.get('route', ''), d.get('airline', ''), d.get('departure_date', ''), d.get('return_date', ''))
              if key not in seen or d.get('timestamp', '') > seen[key].get('timestamp', ''):
                  seen[key] = d

          # 2. Group by (route, airline); keep best DEALS_PER_GROUP by deal quality
          def deal_sort_key(d):
              is_exc = 1 if d.get('deal') == 'EXCEPTIONAL DEAL' else 0
              baseline = d.get('baseline') or 1
              return (-is_exc, d.get('price', 999999) / baseline)

          groups = defaultdict(list)
          for d in seen.values():
              groups[(d.get('route', ''), d.get('airline', ''))].append(d)

          deals = []
          for entries in groups.values():
              entries.sort(key=deal_sort_key)
              deals.extend(entries[:DEALS_PER_GROUP])

          js = (
              '// Auto-generated by the deploy job — do not edit manually.\n'
              f'export const ALL_DEALS = {json.dumps(deals, separators=(",", ":"), ensure_ascii=False)};\n'
          )
          pathlib.Path('deals-data.js').write_text(js, encoding='utf-8')
          print(f'Bundled {len(deals_raw)} raw → {len(deals)} deals into deals-data.js')

          # ── ops-data.js: per-route scan stats + adaptive-skip coverage for
          # the admin "Scans" panel and the weekly ops digest mail.
          # generated_at = max last_scan (not now()) so the file only changes
          # when scan data actually changed — keeps no-op commits away.
          deals_per_route = {}
          for d in seen.values():
              r = d.get('route', '')
              deals_per_route[r] = deals_per_route.get(r, 0) + 1

          import re as _re
          route_names = sorted(
              n for n in (
                  {p.parent.name for p in pathlib.Path('../scans').glob('*/index.json')}
                  | {p.stem for p in pathlib.Path('../skips').glob('*.json')}
              )
              # exclude legacy per-airport tags (AMS, ZRH, …) from local scans
              if _re.fullmatch(r'[A-Z]{3}-[A-Z]{3}', n)
          )
          ops_routes = []
          for name in route_names:
              rec = {'route': name, 'last_scan': None, 'searched': None,
                     'failed': None, 'skipped': None,
                     'deals_count': deals_per_route.get(name, 0),
                     'tracked_buckets': 0, 'skippable_buckets': 0}
              try:
                  idx = json.loads(pathlib.Path(f'../scans/{name}/index.json').read_text(encoding='utf-8'))
                  last = idx[-1]
                  rec['last_scan'] = last.get('timestamp')
                  st = last.get('stats', {})
                  rec['searched'] = st.get('searched')
                  rec['failed'] = st.get('failed')
                  rec['skipped'] = st.get('skipped', 0)
              except Exception:
                  pass
              try:
                  sk = json.loads(pathlib.Path(f'../skips/{name}.json').read_text(encoding='utf-8'))
                  rec['tracked_buckets'] = len(sk)
                  rec['skippable_buckets'] = sum(1 for v in sk.values() if v.get('empty_streak', 0) >= 3)
              except Exception:
                  pass
              ops_routes.append(rec)

          ops = {
              'generated_at': max((r['last_scan'] for r in ops_routes if r['last_scan']), default=None),
              'routes': ops_routes,
          }
          pathlib.Path('ops-data.js').write_text(
              '// Auto-generated by the deploy/bundle job — do not edit manually.\n'
              f'export const OPS = {json.dumps(ops, separators=(",", ":"))};\n',
              encoding='utf-8')
          print(f'Ops summary: {len(ops_routes)} routes into ops-data.js')

      - name: Commit deals-data.js (Cloudflare auto-deploys on push)
        run: |
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-web/deals-data.js public-web/ops-data.js
          if git diff --staged --quiet; then
            echo "deals-data.js / ops-data.js unchanged — nothing to commit."
          else
            git commit -m "chore: update deals-data.js + ops-data.js $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase && git push
          fi

