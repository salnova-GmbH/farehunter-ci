name: FareHunter Instagram Autopilot

# Posts due items from social/instagram/queue/ (private repo) to @farehunter.ch via
# the Instagram API. Items are produced elsewhere — the Deal-of-the-Week carousel by
# blog.yml (Tuesdays), the cabin carousel/Reel by social.yml (Wednesdays, for Thursday)
# and the data carousel by social.yml (Saturdays, for Sunday) — whose media are deployed
# to farehunter.ch/ig/… because the API only accepts public URLs. At most one post per run; stale items expire instead
# of being posted late. See social/instagram/STRATEGY.md in the private repo.
#
# Secrets: IG_ACCESS_TOKEN (without it the job is a no-op) and IG_USER_ID (Instagram
# account id). Default is Meta's Unified Login (graph.facebook.com, system-user token).
# Older Instagram-Login setup: also IG_GRAPH_BASE=https://graph.instagram.com and
# IG_SECRETS_PAT (fine-grained PAT on THIS repo, "Secrets: Read and write") so the
# Monday run can refresh the 60-day token itself.

on:
  schedule:
    # Hourly: GitHub starts scheduled runs of this public repo 5–8 h late (measured
    # 2026-11-19..22: 10:17 → ~18:00, 17:17 → ~22:30). With a run every hour, a due post
    # still goes out within ~1 h of its slot. A run with nothing due takes <1 min and
    # makes no commit.
    - cron: "47 * * * *"
    - cron: "17 10 * * 1"   # Mondays: also the token-refresh run (older Instagram-Login setup only)
  workflow_dispatch: {}

concurrency:
  group: farehunter-instagram
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout private FareHunter repo (queue + scripts only, not the photo library)
        uses: actions/checkout@v7
        with:
          repository: salnova-GmbH/FareHunter
          token: ${{ secrets.FAREHUNTER_PAT }}
          filter: blob:none
          sparse-checkout: |
            /*
            !/*/
            social/instagram/scripts/
            social/instagram/queue/
          sparse-checkout-cone-mode: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Publish due post
        shell: bash   # -o pipefail, so a failed publish still fails the step through tee
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_GRAPH_BASE: ${{ secrets.IG_GRAPH_BASE }}   # empty = Unified Login (graph.facebook.com)
        run: python social/instagram/scripts/publish_instagram.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Only for the older Instagram-Login setup (IG_GRAPH_BASE=https://graph.instagram.com):
      # those tokens expire after 60 days unless refreshed, so the weekly refresh is stored
      # back as the secret. Unified-Login tokens get their expiry from the Meta login
      # configuration ("never" recommended) and the script no-ops.
      - name: Refresh access token (Mondays)
        # the Monday cron only (not the hourly runs): a token must be ≥24 h old to refresh, so a second refresh the same day fails
        if: always() && github.event.schedule == '17 10 * * 1'
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_GRAPH_BASE: ${{ secrets.IG_GRAPH_BASE }}
          GH_TOKEN: ${{ secrets.IG_SECRETS_PAT }}
        run: |
          if [ "$(date -u +%u)" != "1" ]; then echo "Not Monday, no refresh."; exit 0; fi
          if [ -z "$IG_ACCESS_TOKEN" ]; then echo "No token, autopilot off."; exit 0; fi
          python social/instagram/scripts/publish_instagram.py --refresh-token "$RUNNER_TEMP/ig_token"
          if [ ! -s "$RUNNER_TEMP/ig_token" ]; then exit 0; fi   # Unified Login: nothing to store
          if [ -z "$GH_TOKEN" ]; then
            rm -f "$RUNNER_TEMP/ig_token"
            echo "::warning::IG_SECRETS_PAT not set; refreshed token not stored (Instagram-Login token expires 60 days after it was issued)."
            exit 0
          fi
          echo "::add-mask::$(cat "$RUNNER_TEMP/ig_token")"
          gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig_token"
          rm -f "$RUNNER_TEMP/ig_token"

      - name: Commit queue status
        if: always()
        run: |
          if ! git status --porcelain social/instagram/queue | grep -q .; then exit 0; fi
          git config user.name  "FareHunter Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A social/instagram/queue/
          git commit -m "social: instagram queue $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in {1..6}; do
            git pull --rebase && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep $((RANDOM % 15 + 5))
          done
